name: CI Build Test VM

on:
  push:
    branches:
      - lab04
  pull_request:
    branches:
      - lab04
  workflow_dispatch:
  workflow_run:
    workflows:
      - Terraform Kubernetes
    types:
      - completed

env:
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  backend-tests:
    name: Run Tests (Java 21)
    runs-on: ubuntu-latest
    env:
      SPRING_DATASOURCE_URL: jdbc:h2:mem:devdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.h2.Driver
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: ""
      SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
      SECURITY_JWT_SECRET: ${{ secrets.SECURITY_JWT_SECRET_CI }}
      SECURITY_JWT_EXPIRATION_MS: "3600000"
      APP_ADMIN_USERNAME: admin
      APP_ADMIN_EMAIL: admin@example.com
      APP_ADMIN_PASSWORD: ${{ secrets.APP_ADMIN_PASSWORD_CI }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests and coverage
        run: ./mvnw -B clean verify

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: target/surefire-reports/
          if-no-files-found: warn

      - name: Upload code coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: code-coverage
          path: target/site/jacoco/
          if-no-files-found: warn

      - name: Notify Telegram
        if: always()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="Job ${{ github.job }} finished with status: ${{ job.status }}"

  frontend-tests:
    name: Run Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Vitest coverage provider
        run: |
          VITEST_VERSION=$(node -e "const p=require('./package-lock.json'); const v=p.packages?.['node_modules/vitest']?.version||p.dependencies?.vitest?.version; console.log(v||'2')")
          npm install --no-save "@vitest/coverage-v8@${VITEST_VERSION}"

      - name: Run frontend tests with coverage
        run: npx vitest run --coverage.enabled=true --coverage.provider=v8 --coverage.reporter=lcov --coverage.reporter=text-summary

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          if-no-files-found: error

      - name: Notify Telegram
        if: always()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="Job ${{ github.job }} finished with status: ${{ job.status }}"

  backend-sonarqube:
    name: SonarQube Backend Scan
    runs-on: ubuntu-latest
    needs: backend-tests
    env:
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SPRING_DATASOURCE_URL: jdbc:h2:mem:devdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.h2.Driver
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: ""
      SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
      SECURITY_JWT_SECRET: ${{ secrets.SECURITY_JWT_SECRET_CI }}
      SECURITY_JWT_EXPIRATION_MS: "3600000"
      APP_ADMIN_USERNAME: admin
      APP_ADMIN_EMAIL: admin@example.com
      APP_ADMIN_PASSWORD: ${{ secrets.APP_ADMIN_PASSWORD_CI }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Download backend coverage artifact
        uses: actions/download-artifact@v7
        with:
          name: code-coverage
          path: target/site/jacoco

      - name: Run SonarQube scan with quality gate
        run: |
          SONAR_BACKEND_PROJECT_KEY="dp_pro_backend"

          if [ -z "$SONAR_HOST_URL" ] || [ -z "$SONAR_TOKEN" ]; then
            echo "SONAR_HOST_URL and SONAR_TOKEN must be configured in repository secrets"
            exit 1
          fi

          if [ ! -f target/site/jacoco/jacoco.csv ] || [ ! -f target/site/jacoco/jacoco.xml ]; then
            echo "JaCoCo reports not found in artifact"
            exit 1
          fi

          COVERAGE=$(awk -F',' 'NR>1 {miss+=$8; cov+=$9} END {total=miss+cov; pct=(total? cov*100/total:0); printf "%.2f", pct}' target/site/jacoco/jacoco.csv)
          echo "Backend line coverage: ${COVERAGE}%"
          awk -v c="$COVERAGE" 'BEGIN { if (c+0 < 80) { printf "Backend coverage %.2f%% is below required 80%%\n", c; exit 1 } }'

          ./mvnw -B -DskipTests package org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey="$SONAR_BACKEND_PROJECT_KEY" \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=600

      - name: Notify Telegram
        if: always()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="Job ${{ github.job }} finished with status: ${{ job.status }}"

  frontend-sonarqube:
    name: SonarQube Frontend Scan
    runs-on: ubuntu-latest
    needs: frontend-tests
    env:
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Download frontend coverage artifact
        uses: actions/download-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage

      - name: Enforce frontend coverage >= 80%
        run: |
          if [ -z "$SONAR_HOST_URL" ] || [ -z "$SONAR_TOKEN" ]; then
            echo "SONAR_HOST_URL and SONAR_TOKEN must be configured in repository secrets"
            exit 1
          fi
          if [ ! -f frontend/coverage/lcov.info ]; then
            echo "Frontend lcov report not found in artifact"
            exit 1
          fi
          COVERAGE=$(awk -F: '/^LF:/{lf+=$2} /^LH:/{lh+=$2} END {pct=(lf? lh*100/lf:0); printf "%.2f", pct}' frontend/coverage/lcov.info)
          echo "Frontend line coverage: ${COVERAGE}%"
          awk -v c="$COVERAGE" 'BEGIN { if (c+0 < 80) { printf "Frontend coverage %.2f%% is below required 80%%\n", c; exit 1 } }'

      - name: Set frontend Sonar project key
        id: frontend_sonar
        run: |
          FRONTEND_KEY="dp_pro_frontend"
          echo "key=$FRONTEND_KEY" >> "$GITHUB_OUTPUT"

      - name: Run SonarQube frontend scan
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          projectBaseDir: frontend
          args: >
            -Dsonar.projectKey=${{ steps.frontend_sonar.outputs.key }}
            -Dsonar.sources=src
            -Dsonar.tests=src
            -Dsonar.test.inclusions=src/**/*.test.js,src/**/*.test.jsx,src/**/__tests__/**/*
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Check SonarQube frontend quality gate
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
        timeout-minutes: 10
        with:
          scanMetadataReportFile: frontend/.scannerwork/report-task.txt
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      
      - name: Notify Telegram
        if: always()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="Job ${{ github.job }} finished with status: ${{ job.status }}"


  build-backend-jar:
    name: Build Backend JAR And Upload Artifact
    runs-on: ubuntu-latest
    needs: backend-sonarqube
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build JAR
        run: ./mvnw -B clean package -DskipTests -Djacoco.skip=true

      - name: Upload backend JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: backend-jar
          path: target/devops_project-*.jar
          if-no-files-found: error

  build-frontend:
    name: Build Frontend And Upload Artifact
    runs-on: ubuntu-latest
    needs: frontend-sonarqube
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Upload frontend dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
      
      - name: Notify Telegram
        if: always()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="Job ${{ github.job }} finished with status: ${{ job.status }}"

  build-and-push-images:
    name: Build Docker Images From Artifacts And Push To GHCR
    runs-on: ubuntu-latest
    needs: [build-backend-jar, build-frontend]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Download backend JAR artifact
        uses: actions/download-artifact@v7
        with:
          name: backend-jar
          path: target

      - name: Download frontend dist artifact
        uses: actions/download-artifact@v7
        with:
          name: frontend-dist
          path: frontend-dist

      - name: Normalize backend artifact layout
        run: |
          mkdir -p target
          JAR_PATH="$(find target -type f -name '*.jar' ! -name '*.jar.original' | head -n 1)"
          if [ -z "$JAR_PATH" ]; then
            echo "Backend JAR artifact not found"
            exit 1
          fi
          cp "$JAR_PATH" target/app.jar

      - name: Normalize frontend artifact layout
        run: |
          if [ -d frontend-dist/frontend/dist ]; then
            cp -R frontend-dist/frontend/dist/. frontend-dist/
          elif [ -d frontend-dist/dist ]; then
            cp -R frontend-dist/dist/. frontend-dist/
          fi
          if [ ! -f frontend-dist/index.html ]; then
            echo "Frontend dist artifact does not contain index.html"
            exit 1
          fi

      - name: Create frontend runtime Dockerfile
        run: |
          printf 'FROM nginx:1.29-alpine\nCOPY frontend-dist/ /usr/share/nginx/html/\nCOPY frontend/nginx.conf /etc/nginx/conf.d/default.conf\nEXPOSE 80\n' > Dockerfile.frontend.artifact

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image names
        id: images
        run: |
          REPO_LOWER="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "backend=ghcr.io/${REPO_LOWER}" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/${REPO_LOWER}" >> "$GITHUB_OUTPUT"

      - name: Extract backend Docker metadata
        id: backend_meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.images.outputs.backend }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Extract frontend Docker metadata
        id: frontend_meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.images.outputs.frontend }}
          tags: |
            type=raw,value=frontend-sha-${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.backend_meta.outputs.tags }}
          labels: ${{ steps.backend_meta.outputs.labels }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.frontend.artifact
          push: true
          tags: ${{ steps.frontend_meta.outputs.tags }}
          labels: ${{ steps.frontend_meta.outputs.labels }}

      - name: Notify Telegram
        if: always()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="Job ${{ github.job }} finished with status: ${{ job.status }}"

  argo-cd-release:
    name: ArgoCD Release
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/lab04' && github.actor != 'github-actions[bot]' }}
    needs: [ build-and-push-images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Update backend and frontend image tags for ArgoCD
        run: |
          REPO_LOWER="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          BACKEND_IMAGE="ghcr.io/${REPO_LOWER}:sha-${{ github.sha }}"
          FRONTEND_IMAGE="ghcr.io/${REPO_LOWER}:frontend-sha-${{ github.sha }}"

          sed -i.bak -E "s|(^[[:space:]]*image:[[:space:]]*).*$|\\1${BACKEND_IMAGE}|" kubernetes/backend.yaml
          sed -i.bak -E "s|(^[[:space:]]*image:[[:space:]]*).*$|\\1${FRONTEND_IMAGE}|" kubernetes/frontend.yaml
          rm -f kubernetes/*.bak

      - name: Commit and push manifest updates
        run: |
          if git diff --quiet -- kubernetes/backend.yaml kubernetes/frontend.yaml; then
            echo "No GitOps image updates required"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kubernetes/backend.yaml kubernetes/frontend.yaml
          git commit -m "ci(gitops): update images for ArgoCD"
          git push
      
      - name: Notify Telegram
        if: always()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="Job ${{ github.job }} finished with status: ${{ job.status }}"
        # 
